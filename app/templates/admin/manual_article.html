{% extends "admin/layout.html" %}
{% block content %}

<h1 class="mb-4">Manual Article Upload</h1>

<p class="text-muted">
    Paste the JSON article you generated with Copilot.  
    It must contain: title, summary, content, faq, schema.
</p>

<form method="POST">
    <div class="mb-3">
        <label class="form-label">JSON Article</label>
        <textarea name="json_data" class="form-control" rows="20" required></textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Category</label>
        <select name="category_id" class="form-select" required>
            {% for cat in categories %}
            <option value="{{ cat.id }}">{{ cat.name }}</option>
            {% endfor %}
        </select>
    </div>

    <button class="btn btn-success btn-lg">Save Article</button>
</form>

{% endblock %}
