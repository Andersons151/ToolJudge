{% extends "admin/layout.html" %}
{% block content %}

<h1 class="mb-4">Categories</h1>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Name</th>
            <th>Slug</th>
            <th>Icon</th>
            <th>Description</th>
        </tr>
    </thead>

    <tbody>
        {% for cat in categories %}
        <tr>
            <td>{{ cat.name }}</td>
            <td>{{ cat.slug }}</td>
            <td>{{ cat.icon }}</td>
            <td>{{ cat.description }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
