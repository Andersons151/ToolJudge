services:
  - type: web
    name: nofooltools
    env: python
    plan: starter
    region: frankfurt

    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()"

    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.10
      - key: WEB_CONCURRENCY
        value: 2
      - key: GUNICORN_CMD_ARGS
        value: --timeout 120 --log-level info

databases:
  - name: nofooltools-db
    plan: starter
    region: frankfurt
